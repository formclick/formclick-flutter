name: formclick
description: Flutter/Dart client for Formclick form submissions. Provides a provider, state notifier, and low-level API for submitting form data.
version: 0.1.0
homepage: https://formclick.io
repository: https://github.com/formclick/formclick-flutter

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

# ── Platform support ───────────────────────────────────────────────────────────
# This package is a pure Flutter/Dart package (no native plugin code).
# It relies only on Flutter widgets + the `http` package, which supports
# all six Flutter platforms out of the box.
flutter:
  platforms:
    android:
    ios:
    linux:
    macos:
    web:
    windows:

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
